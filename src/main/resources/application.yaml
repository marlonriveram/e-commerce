server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: e-commerce

  datasource:
    url: jdbc:postgresql://localhost:5432/e_commerce
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway ahora controla el esquema (db/migration). Hibernate solo VALIDA
      # que las entidades coincidan con el esquema, ya no lo crea ni lo modifica.
      # "update" ya NO se usa: si cambias una entidad, debes crear V3__...sql.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Configuración de RabbitMQ ──
  # Spring Boot Autoconfiguration detecta esta sección y crea automáticamente
  # un RabbitTemplate y un CachingConnectionFactory conectados a este broker.
  # Estos valores deben coincidir con los del servicio en docker-compose.yml.
  rabbitmq:
    host: localhost      # dirección del broker (localhost porque Docker expone el puerto)
    port: 5672           # puerto AMQP estándar (NO confundir con 15672 que es la Management UI)
    username: guest      # credenciales por defecto de RabbitMQ
    password: guest

  # ── Spring Mail (SMTP — Mailtrap en desarrollo) ──
  # JavaMailSender usa estas credenciales para enviar correos.
  # Se resuelven desde variables de entorno del sistema (definidas via setx):
  #   setx MAIL_HOST "sandbox.smtp.mailtrap.io"
  #   setx MAIL_PORT "2525"
  #   setx MAIL_USERNAME "tu_usuario"
  #   setx MAIL_PASSWORD "tu_password"
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ── Spring AI (Groq) ──
  # Groq expone una API compatible con OpenAI: Spring AI la integra reutilizando
  # el cliente OpenAI, apuntando el base-url a api.groq.com/openai/v1.
  # La API key se resuelve desde la variable de entorno del sistema ${GROQ_API_KEY}
  # (definida via `setx GROQ_API_KEY`, almacenada en .env excluido del repo).
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b
        temperature: 0.7
