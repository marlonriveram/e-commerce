server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: e-commerce

  datasource:
    url: jdbc:postgresql://localhost:5432/e_commerce
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
